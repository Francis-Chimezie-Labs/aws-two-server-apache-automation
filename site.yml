---
- name: Configure Apache web servers
  hosts: webservers
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Make sure Apache is running
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Deploy custom Apache webpage
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"